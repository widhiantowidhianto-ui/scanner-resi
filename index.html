<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPX OCR SCANNER PRO v5.0</title>

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* Header Modern */
    .header {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
      padding: 20px 15px;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      letter-spacing: -0.5px;
    }

    .header span {
      font-weight: 400;
      opacity: 0.9;
      font-size: 18px;
    }

    /* Main Container */
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    /* Card Styling */
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid #f1f5f9;
    }

    /* Typography & Labels */
    label.title, .card-title {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Input Fields */
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      color: #1e293b;
      background-color: white;
      transition: all 0.2s ease-in-out;
      -webkit-appearance: none;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }

    input[type="text"]::placeholder {
      color: #94a3b8;
    }

    /* Buttons Style */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    button, .tombol-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    button:active, .tombol-btn:active {
      transform: translateY(1px);
      filter: brightness(95%);
    }

    .btn-main { background-color: #16a34a; color: white; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2); }
    .btn-main:hover { background-color: #15803d; }

    .btn-secondary { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-action { background-color: #2563eb; color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
    .btn-action:hover { background-color: #1d4ed8; }

    .btn-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background-color: #fecaca; }

    /* Area Foto & Scan */
    #foto {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      border: 2px solid #e2e8f0;
      background-color: #ffffff;
    }

    /* Area Hasil OCR */
    .hasil-container {
      margin-top: 15px;
    }

    .hasil-box {
      background-color: #f0fdf4;
      border: 2px dashed #bbf7d0;
      padding: 15px;
      border-radius: 12px;
      word-break: break-all;
    }

    .hasil-box b {
      font-size: 20px;
      color: #15803d;
      display: block;
      margin-bottom: 8px;
    }

    .raw-text {
      color: #64748b;
      font-size: 13px;
      max-height: 80px;
      overflow-y: auto;
      display: block;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #d1fae5;
    }

    /* Counter Resi */
    .total-container {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f1f5f9;
    }

    .total-label {
      font-size: 14px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-number {
      font-size: 42px;
      font-weight: 800;
      color: #16a34a;
      line-height: 1;
    }

    /* Input Manual Bar */
    .input-manual-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .input-manual-bar input {
      flex: 1;
    }

    .input-manual-bar button {
      width: auto;
      padding: 14px 20px;
    }

    /* Daftar Resi */
    #daftar {
      margin-top: 10px;
    }

    .resi-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background-color: white;
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.2s;
    }

    .resi-item:hover {
      background-color: #f8fafc;
    }

    .resi-item:last-child {
      border-bottom: none;
    }

    .resi-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .resi-number-tag {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      width: 24px;
    }

    .resi-value {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-all;
    }

    .resi-item button {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
    }

    /* Status Bar */
    .status-bar {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background-color: #f1f5f9;
      font-size: 14px;
      color: #64748b;
      text-align: center;
      font-weight: 500;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Scanner Resi <span>OCR & Barcode Pro</span>
</div>

<div class="container">

  <!-- Identitas Petugas -->
  <div class="card">
    <label class="title" for="petugas">👤 Nama Petugas / Kurir</label>
    <input id="petugas" type="text" placeholder="Contoh: Dhian Purnomo" value="Dhian Purnomo" autocomplete="off">
  </div>

  <!-- Area Pindaian -->
  <div class="card">
    <div class="total-container">
      <div class="total-label">Resi Terrekam</div>
      <div class="total-number"><span>2</span></div>
    </div>

    <div class="button-group">
      <label class="tombol-btn btn-main">
        📷 AMBIL FOTO RESI
      </label>

      <label class="tombol-btn btn-secondary">
        🖼️ PILIH DARI GALERI
      </label>
    </div>

    <!-- Status Pembacaan -->
    <div class="status-bar" style="color: #16a34a;">
      ✅ Nomor resi berhasil terdeteksi.
    </div>

    <!-- Contoh Tampilan Hasil Pindaian -->
    <div class="hasil-container">
      <div class="hasil-box">
        <div class="card-title">🔍 Hasil Deteksi Otomatis:</div>
        <b>SPXID03291823712</b>
        <span style="font-size:11px; color:#16a34a; font-weight:bold;">Terdeteksi via Barcode Reader</span>
        <span class="raw-text">RAW OCR: SPXID03291823712 STANDARD DELIVERY</span>
      </div>
      
      <button class="btn-main" style="margin-top:12px">
        ✅ TAMBAHKAN NOMOR INI
      </button>
    </div>
  </div>

  <!-- Input Manual Resi -->
  <div class="card">
    <div class="card-title">⌨️ Input Resi Manual</div>
    <div class="input-manual-bar">
      <input type="text" placeholder="Masukkan SPXID...">
      <button class="btn-action">+ Tambah</button>
    </div>
  </div>

  <!-- Daftar Resi Contoh Dummy -->
  <div class="card">
    <div class="card-title">📄 Daftar Resi</div>
    <div id="daftar">
      <div class="resi-item">
        <div class="resi-info">
          <span class="resi-number-tag">1.</span>
          <span class="resi-value">SPXID03291823712</span>
        </div>
        <button class="btn-danger">Hapus</button>
      </div>
      <div class="resi-item">
        <div class="resi-info">
          <span class="resi-number-tag">2.</span>
          <span class="resi-value">SPXID03982310111</span>
        </div>
        <button class="btn-danger">Hapus</button>
      </div>
    </div>
  </div>

  <!-- Aksi Kirim/Hapus -->
  <div class="card" style="background-color: transparent; box-shadow: none; border: none; padding: 0;">
    <div class="button-group">
      <button class="btn-action">🚀 KIRIM SEMUA RESI</button>
      <button class="btn-danger">🗑️ HAPUS SEMUA</button>
    </div>
  </div>

</div>

</body>
</html>
