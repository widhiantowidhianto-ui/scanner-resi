<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPX OCR SCANNER PRO v5.0</title>

  <!-- Library ZXing (Detector Barcode/QR Super Cepat & Akurat) -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- Library Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* Header Modern */
    .header {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
      padding: 20px 15px;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      letter-spacing: -0.5px;
    }

    .header span {
      font-weight: 400;
      opacity: 0.9;
      font-size: 18px;
    }

    /* Main Container */
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    /* Card Styling */
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid #f1f5f9;
    }

    /* Typography & Labels */
    label.title, .card-title {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Input Fields */
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      color: #1e293b;
      background-color: white;
      transition: all 0.2s ease-in-out;
      -webkit-appearance: none;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }

    input[type="text"]::placeholder {
      color: #94a3b8;
    }

    /* Buttons Style */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    button, .tombol-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    button:active, .tombol-btn:active {
      transform: translateY(1px);
      filter: brightness(95%);
    }

    .btn-main { background-color: #16a34a; color: white; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2); }
    .btn-main:hover { background-color: #15803d; }

    .btn-secondary { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-action { background-color: #2563eb; color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
    .btn-action:hover { background-color: #1d4ed8; }

    .btn-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background-color: #fecaca; }

    /* Area Foto & Scan */
    #foto {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      border: 2px solid #e2e8f0;
      background-color: #ffffff;
    }

    /* Area Hasil OCR */
    .hasil-container {
      margin-top: 15px;
      display: none;
    }

    .hasil-box {
      background-color: #f0fdf4;
      border: 2px dashed #bbf7d0;
      padding: 15px;
      border-radius: 12px;
      word-break: break-all;
    }

    .hasil-box b {
      font-size: 20px;
      color: #15803d;
      display: block;
      margin-bottom: 8px;
    }

    .raw-text {
      color: #64748b;
      font-size: 13px;
      max-height: 80px;
      overflow-y: auto;
      display: block;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #d1fae5;
    }

    /* Counter Resi */
    .total-container {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f1f5f9;
    }

    .total-label {
      font-size: 14px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-number {
      font-size: 42px;
      font-weight: 800;
      color: #16a34a;
      line-height: 1;
    }

    /* Input Manual Bar */
    .input-manual-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .input-manual-bar input {
      flex: 1;
    }

    .input-manual-bar button {
      width: auto;
      padding: 14px 20px;
    }

    /* Daftar Resi */
    #daftar {
      margin-top: 10px;
    }

    .resi-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background-color: white;
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.2s;
    }

    .resi-item:hover {
      background-color: #f8fafc;
    }

    .resi-item:last-child {
      border-bottom: none;
    }

    .resi-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .resi-number-tag {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      width: 24px;
    }

    .resi-value {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-all;
    }

    .resi-item button {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
    }

    /* Status Bar */
    .status-bar {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background-color: #f1f5f9;
      font-size: 14px;
      color: #64748b;
      text-align: center;
      font-weight: 500;
      border: 1px solid #e2e8f0;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 20px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Scanner Resi <span>OCR & Barcode Pro</span>
</div>

<div class="container">

  <!-- Identitas Petugas -->
  <div class="card">
    <label class="title" for="petugas">👤 Nama Petugas / Kurir</label>
    <input id="petugas" type="text" placeholder="Contoh: Dhian Purnomo" autocomplete="off">
  </div>

  <!-- Area Pindaian -->
  <div class="card">
    <div class="total-container">
      <div class="total-label">Resi Terrekam</div>
      <div class="total-number"><span id="jumlah">0</span></div>
    </div>

    <div class="button-group">
      <label for="kameraInput" class="tombol-btn btn-main">
        📷 AMBIL FOTO RESI
      </label>
      <input id="kameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="prosesFile(event)">

      <label for="galeriInput" class="tombol-btn btn-secondary">
        🖼️ PILIH DARI GALERI
      </label>
      <input id="galeriInput" type="file" accept="image/*" style="display:none" onchange="prosesFile(event)">
    </div>

    <!-- Preview Foto Asli (Tanpa Efek Rusak) -->
    <img id="foto" alt="Preview Resi">
    <canvas id="procCanvas" style="display:none;"></canvas>

    <!-- Status Pembacaan -->
    <div id="status" class="status-bar">
      Siap. Ambil foto resi untuk mulai membaca.
    </div>

    <!-- Hasil Pindaian -->
    <div id="hasil" class="hasil-container">
      <div class="hasil-box">
        <div class="card-title">🔍 Hasil Deteksi Otomatis:</div>
        <div id="hasilText"></div>
      </div>
      
      <button id="tambahBtn" class="btn-main" style="display:none; margin-top:12px" onclick="gunakanHasil()">
        ✅ TAMBAHKAN NOMOR INI
      </button>
    </div>
  </div>

  <!-- Input Manual Resi -->
  <div class="card">
    <div class="card-title">⌨️ Input Resi Manual</div>
    <div class="input-manual-bar">
      <input id="manualResi" type="text" placeholder="Masukkan SPXID...">
      <button class="btn-action" onclick="tambahManual()">+ Tambah</button>
    </div>
  </div>

  <!-- Daftar Resi -->
  <div class="card">
    <div class="card-title">📄 Daftar Resi</div>
    <div id="daftar"></div>
  </div>

  <!-- Aksi Kirim/Hapus -->
  <div class="card" style="background-color: transparent; box-shadow: none; border: none; padding: 0;">
    <div class="button-group">
      <button class="btn-action" onclick="kirimSemua()">🚀 KIRIM SEMUA RESI</button>
      <button class="btn-danger" onclick="hapusSemua()">🗑️ HAPUS SEMUA</button>
    </div>
  </div>

</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/a/macros/spxexpress.com/s/AKfycbzMwkx6yYYu63IHNDiwKl7GwXggLjJSEOOhA-dFlKIOyjW0QzHquJ3iQFDdc8JHrm9hAw/exec";
  
  let hasilNomor = "";
  let resi = JSON.parse(localStorage.getItem("scanner_resi") || "[]");

  const elStatus = document.getElementById("status");
  const elFoto = document.getElementById("foto");
  const elCanvas = document.getElementById("procCanvas");
  const elHasilContainer = document.getElementById("hasil");
  const elHasilText = document.getElementById("hasilText");
  const elTambahBtn = document.getElementById("tambahBtn");
  const elPetugas = document.getElementById("petugas");
  const elDaftar = document.getElementById("daftar");
  const elJumlah = document.getElementById("jumlah");

  elPetugas.value = localStorage.getItem("scanner_petugas") || "";
  elPetugas.addEventListener("input", function() {
    localStorage.setItem("scanner_petugas", elPetugas.value);
  });

  function tampilkan() {
    elJumlah.innerText = resi.length;
    elDaftar.innerHTML = "";

    if (resi.length === 0) {
      elDaftar.innerHTML = "<div class='empty-state'>Belum ada resi yang ditambahkan.</div>";
      return;
    }

    resi.forEach(function(nomor, index) {
      const divItem = document.createElement("div");
      divItem.className = "resi-item";
      divItem.innerHTML = `
        <div class="resi-info">
          <span class="resi-number-tag">${index + 1}.</span>
          <span class="resi-value">${nomor}</span>
        </div>
        <button class="btn-danger" onclick="hapusResi(${index})">Hapus</button>
      `;
      elDaftar.appendChild(divItem);
    });
  }

  function simpan() {
    localStorage.setItem("scanner_resi", JSON.stringify(resi));
  }

  function prosesFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    elHasilContainer.style.display = "none";
    elTambahBtn.style.display = "none";
    hasilNomor = "";

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = async function() {
        elFoto.src = e.target.result;
        elFoto.style.display = "block";

        elStatus.innerText = "⚡ Menjalankan Pemindaian...";
        elStatus.style.color = "#2563eb";

        // Jalankan sistem pembaca ganda
        await prosesMultiEngine(img, e.target.result);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = "";
  }

  // Dual Engine: Barcode Scanner -> OCR
  async function prosesMultiEngine(imgElement, dataUrl) {
    // Stage 1: Coba scan barcode resi via ZXing (Instan & Sangat Akurat)
    try {
      const codeReader = new ZXing.BrowserMultiFormatReader();
      const result = await codeReader.decodeFromImageUrl(dataUrl);

      if (result && result.text) {
        const kandidatBarcode = cariNomorResi(result.text);
        if (kandidatBarcode) {
          tampilkanSukses(kandidatBarcode, "Barcode Reader", result.text);
          return;
        }
      }
    } catch (e) {
      console.log("Stage 1 (Barcode) tidak menemukan barcode, lanjut ke Stage 2 (OCR)...");
    }

    // Stage 2: Fallback ke Tesseract OCR dengan Mode Single Line
    try {
      elStatus.innerText = "⏳ Membaca Teks Resi (OCR)...";
      
      const worker = await Tesseract.createWorker("eng");
      await worker.setParameters({
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
      });

      const ret = await worker.recognize(imgElement);
      await worker.terminate();

      const teksMentah = ret.data.text || "";
      const kandidatOCR = cariNomorResi(teksMentah);

      if (kandidatOCR) {
        tampilkanSukses(kandidatOCR, "OCR Engine", teksMentah);
      } else {
        elHasilContainer.style.display = "block";
        elHasilText.innerHTML = `
          <span style="color:#dc2626; font-weight:600;">Nomor resi SPXID tidak terdeteksi.</span>
          <span class="raw-text">${teksMentah.replace(/\n/g, "<br>") || "Gambar tidak terbaca"}</span>
        `;
        elStatus.innerText = "⚠️ Format SPXID tidak terdeteksi otomatis.";
        elStatus.style.color = "#ea580c";
      }

    } catch (err) {
      console.error(err);
      elStatus.innerText = "❌ Gagal memproses gambar: " + err.message;
      elStatus.style.color = "#dc2626";
    }
  }

  function tampilkanSukses(nomor, metode, teksMentah) {
    hasilNomor = nomor;
    elHasilContainer.style.display = "block";
    elHasilText.innerHTML = `
      <b>${nomor}</b>
      <span style="font-size:11px; color:#16a34a; font-weight:bold;">Terdeteksi via ${metode}</span>
      <span class="raw-text">${teksMentah.replace(/\n/g, "<br>")}</span>
    `;
    elTambahBtn.style.display = "block";
    elStatus.innerText = "✅ Nomor resi berhasil terdeteksi.";
    elStatus.style.color = "#16a34a";
  }

  // Regex Pintar untuk Menangkap Berbagai Variasi SPXID
  function cariNomorResi(teks) {
    if (!teks) return null;

    let t = teks.toUpperCase().replace(/[\r\n\t]/g, " ").replace(/\s+/g, "");

    // 1. SPXID diikuti 10-15 digit angka
    let match = t.match(/SPXID(\d{10,15})/);
    if (match) return "SPXID" + match[1];

    // 2. SPXID terpisah spos/simbol
    match = t.match(/S\s*P\s*X\s*I\s*D\s*[-:]*\s*(\d{10,15})/);
    if (match) return "SPXID" + match[1];

    // 3. Karakter mirip (misal IO/1D/D terjemahan dari ID)
    match = t.match(/SPX(ID|1D|IO|D|L)(\d{10,15})/);
    if (match) return "SPXID" + match[2];

    // 4. Deretan 10-14 angka jika ada kata SPX
    match = t.match(/(\d{10,14})/);
    if (match && t.includes("SPX")) return "SPXID" + match[1];

    return null;
  }

  function gunakanHasil() {
    if (!hasilNomor) return;
    tambahResi(hasilNomor);
    
    elHasilContainer.style.display = "none";
    elTambahBtn.style.display = "none";
    elFoto.style.display = "none";
    elStatus.innerText = "Siap untuk scan berikutnya.";
    elStatus.style.color = "#64748b";
  }

  function tambahManual() {
    const elInput = document.getElementById("manualResi");
    const nilai = elInput.value.trim();
    if (nilai) {
      tambahResi(nilai);
      elInput.value = "";
    }
  }

  function tambahResi(nomor) {
    nomor = String(nomor).toUpperCase().replace(/[^A-Z0-9]/g, "");

    if (!nomor) return;

    if (resi.includes(nomor)) {
      alert("⚠️ Resi " + nomor + " sudah ada dalam daftar.");
      return;
    }

    resi.unshift(nomor);
    simpan();
    tampilkan();
  }

  function hapusResi(index) {
    if (confirm("Hapus resi " + resi[index] + "?")) {
      resi.splice(index, 1);
      simpan();
      tampilkan();
    }
  }

  function hapusSemua() {
    if (resi.length === 0) return;
    if (!confirm("⚠️ Yakin ingin menghapus SEMUA resi?")) return;
    resi = [];
    simpan();
    tampilkan();
    elStatus.innerText = "Daftar resi telah dibersihkan.";
  }

  async function kirimSemua() {
    const namaPetugas = elPetugas.value.trim();

    if (!namaPetugas) {
      alert("⚠️ Harap masukkan Nama Petugas terlebih dahulu.");
      elPetugas.focus();
      return;
    }

    if (resi.length === 0) {
      alert("⚠️ Belum ada resi untuk dikirim.");
      return;
    }

    if (!confirm("🚀 Kirim " + resi.length + " resi sekarang?")) return;

    const batchId = namaPetugas.toUpperCase().substring(0,3) + "-" + Date.now();
    const payload = {
      petugas: namaPetugas,
      batch: batchId,
      resi: resi
    };

    elStatus.innerText = "⏳ Sedang mengirim data...";
    elStatus.style.color = "#2563eb";

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      alert("✅ Data berhasil dikirim!");
      resi = [];
      simpan();
      tampilkan();
      elStatus.innerText = "✅ Data berhasil dikirim ke pusat.";
      elStatus.style.color = "#16a34a";

    } catch(error) {
      console.error(error);
      alert("❌ Pengiriman gagal. Coba cek koneksi internet Anda.");
      elStatus.innerText = "❌ Gagal mengirim data.";
      elStatus.style.color = "#dc2626";
    }
  }

  tampilkan();
</script>

</body>
</html>
