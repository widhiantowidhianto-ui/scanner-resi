<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Resi OCR Pro</title>

  <!-- Library Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    .header {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
      padding: 20px 15px;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      letter-spacing: -0.5px;
    }

    .header span {
      font-weight: 400;
      opacity: 0.9;
      font-size: 18px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
    }

    label.title, .card-title {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      color: #1e293b;
      background-color: white;
      transition: all 0.2s ease-in-out;
      -webkit-appearance: none;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    button, .tombol-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    button:active, .tombol-btn:active {
      transform: translateY(1px);
      filter: brightness(95%);
    }

    .btn-main { background-color: #16a34a; color: white; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2); }
    .btn-secondary { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-action { background-color: #2563eb; color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
    .btn-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }

    #foto {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      border: 2px solid #e2e8f0;
      background-color: #f1f5f9;
    }

    .hasil-container {
      margin-top: 15px;
      display: none;
    }

    .hasil-box {
      background-color: #f0fdf4;
      border: 2px dashed #bbf7d0;
      padding: 15px;
      border-radius: 12px;
      word-break: break-all;
    }

    .hasil-box b {
      font-size: 18px;
      color: #15803d;
      display: block;
      margin-bottom: 8px;
    }

    .raw-text {
      color: #64748b;
      font-size: 13px;
      max-height: 80px;
      overflow-y: auto;
      display: block;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #d1fae5;
    }

    .total-container {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f1f5f9;
    }

    .total-label {
      font-size: 14px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-number {
      font-size: 42px;
      font-weight: 800;
      color: #16a34a;
      line-height: 1;
    }

    .input-manual-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .input-manual-bar input {
      flex: 1;
    }

    .input-manual-bar button {
      width: auto;
      padding: 14px 20px;
      white-space: nowrap;
    }

    #daftar {
      margin-top: 10px;
    }

    .resi-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background-color: white;
      border-bottom: 1px solid #f1f5f9;
    }

    .resi-item:last-child {
      border-bottom: none;
    }

    .resi-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .resi-number-tag {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    .resi-value {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-all;
    }

    .resi-item button {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 12px;
    }

    .status-bar {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background-color: #f1f5f9;
      font-size: 14px;
      color: #64748b;
      text-align: center;
      font-weight: 500;
      border: 1px solid #e2e8f0;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 15px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Scanner Resi <span>OCR Pro</span>
</div>

<div class="container">

  <!-- Identitas Petugas -->
  <div class="card">
    <label class="title" for="petugas">👤 NAMA PETUGAS / KURIR</label>
    <input id="petugas" type="text" placeholder="Contoh: Dhian" autocomplete="off">
  </div>

  <!-- Area Pindaian OCR -->
  <div class="card">
    <div class="total-container">
      <div class="total-label">RESI TERREKAM</div>
      <div class="total-number"><span id="jumlah">0</span></div>
    </div>

    <div class="button-group">
      <label for="kameraInput" class="tombol-btn btn-main">
        📷 AMBIL FOTO RESI
      </label>
      <input id="kameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="prosesFile(event)">

      <label for="galeriInput" class="tombol-btn btn-secondary">
        🖼️ PILIH DARI GALERI
      </label>
      <input id="galeriInput" type="file" accept="image/*" style="display:none" onchange="prosesFile(event)">
    </div>

    <!-- Foto Preview -->
    <img id="foto" alt="Preview Resi">

    <!-- Status Pembacaan -->
    <div id="status" class="status-bar">
      Siap. Ambil foto resi untuk mulai membaca.
    </div>

    <!-- Hasil Pindaian -->
    <div id="hasil" class="hasil-container">
      <div class="hasil-box">
        <div class="card-title">🔍 Hasil Deteksi Otomatis:</div>
        <div id="hasilText"></div>
      </div>
      
      <button id="tambahBtn" class="btn-main" style="display:none; margin-top:12px" onclick="gunakanHasil()">
        ✅ TAMBAHKAN NOMOR INI
      </button>
    </div>
  </div>

  <!-- Input Manual Resi -->
  <div class="card">
    <div class="card-title">⌨️ INPUT RESI MANUAL</div>
    <div class="input-manual-bar">
      <input id="manualResi" type="text" placeholder="SPXID068255909326" onkeypress="handleKeyPress(event)">
      <button type="button" class="btn-action" onclick="tambahManual()">+ Tambah</button>
    </div>
  </div>

  <!-- Daftar Resi -->
  <div class="card">
    <div class="card-title">📄 DAFTAR RESI</div>
    <div id="daftar"></div>
  </div>

  <!-- Aksi Kirim/Hapus -->
  <div class="card" style="background-color: transparent; box-shadow: none; border: none; padding: 0;">
    <div class="button-group">
      <button type="button" class="btn-action" onclick="kirimSemua()">🚀 KIRIM SEMUA RESI</button>
      <button type="button" class="btn-danger" onclick="hapusSemua()">🗑️ HAPUS SEMUA</button>
    </div>
  </div>

</div>

<script>
  // URL APPS SCRIPT WORK SPX
  const APPS_SCRIPT_URL = "https://script.google.com/a/macros/spxexpress.com/s/AKfycbz5eS8WeGfnkHWeLD6AKBjdW78LIWgdH-Tzv_pvzWz9u0MexAOMEIFtfoD9A3RrI42WXw/exec";

  let hasilNomor = "";
  let resi = JSON.parse(localStorage.getItem("scanner_resi") || "[]");

  const elStatus = document.getElementById("status");
  const elFoto = document.getElementById("foto");
  const elHasilContainer = document.getElementById("hasil");
  const elHasilText = document.getElementById("hasilText");
  const elTambahBtn = document.getElementById("tambahBtn");
  const elPetugas = document.getElementById("petugas");
  const elDaftar = document.getElementById("daftar");
  const elJumlah = document.getElementById("jumlah");

  // Load Nama Petugas dari storage
  elPetugas.value = localStorage.getItem("scanner_petugas") || "";
  elPetugas.addEventListener("input", function() {
    localStorage.setItem("scanner_petugas", elPetugas.value);
  });

  // Tampilkan daftar resi awal
  function tampilkan() {
    elJumlah.innerText = resi.length;
    elDaftar.innerHTML = "";

    if (resi.length === 0) {
      elDaftar.innerHTML = "<div class='empty-state'>Belum ada resi yang ditambahkan.</div>";
      return;
    }

    resi.forEach(function(nomor, index) {
      const divItem = document.createElement("div");
      divItem.className = "resi-item";
      divItem.innerHTML = `
        <div class="resi-info">
          <span class="resi-number-tag">${index + 1}.</span>
          <span class="resi-value">${nomor}</span>
        </div>
        <button type="button" class="btn-danger" onclick="hapusResi(${index})">Hapus</button>
      `;
      elDaftar.appendChild(divItem);
    });
  }

  function simpan() {
    localStorage.setItem("scanner_resi", JSON.stringify(resi));
  }

  // FUNGSI INPUT MANUAL (FIXED)
  function tambahManual() {
    const elInput = document.getElementById("manualResi");
    if (!elInput) return;
    
    const nilai = elInput.value.trim();
    if (nilai !== "") {
      tambahResi(nilai);
      elInput.value = ""; // Kosongkan input setelah ditambah
      elInput.focus();
    } else {
      alert("Masukkan nomor resi terlebih dahulu.");
    }
  }

  // Fitur Tekan Enter untuk Tambah Manual
  function handleKeyPress(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      tambahManual();
    }
  }

  function tambahResi(nomor) {
    // Format nomor resi ke huruf besar tanpa karakter aneh
    nomor = String(nomor).toUpperCase().replace(/[^A-Z0-9]/g, "");

    if (!nomor) return;

    if (resi.includes(nomor)) {
      alert("⚠️ Resi " + nomor + " sudah ada dalam daftar.");
      return;
    }

    resi.unshift(nomor); // Tambah ke baris paling atas
    simpan();
    tampilkan();
    
    elStatus.innerText = "✅ Resi " + nomor + " berhasil ditambahkan.";
    elStatus.style.color = "#16a34a";
  }

  function gunakanHasil() {
    if (!hasilNomor) return;
    tambahResi(hasilNomor);
    
    elHasilContainer.style.display = "none";
    elTambahBtn.style.display = "none";
    elFoto.style.display = "none";
    elStatus.innerText = "Siap untuk scan berikutnya.";
    elStatus.style.color = "#64748b";
  }

  function prosesFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    prosesGambar(file);
    event.target.value = "";
  }

  async function prosesGambar(file) {
    elHasilContainer.style.display = "none";
    elTambahBtn.style.display = "none";
    hasilNomor = "";

    elFoto.src = URL.createObjectURL(file);
    elFoto.style.display = "block";

    elStatus.innerText = "🔍 Sedang membaca tulisan...";
    elStatus.style.color = "#2563eb";

    try {
      const result = await Tesseract.recognize(file, "eng", {
        logger: function(info) {
          if (info.status === "recognizing text") {
            const persen = Math.round(info.progress * 100);
            elStatus.innerText = "⏳ Membaca... (" + persen + "%)";
          }
        }
      });

      const teksMentah = result.data.text;
      elHasilContainer.style.display = "block";

      const kandidat = cariNomorResi(teksMentah);

      if (kandidat) {
        hasilNomor = kandidat;
        elHasilText.innerHTML = `
          <b>${kandidat}</b>
          <span class="raw-text">${teksMentah.replace(/\n/g, "<br>")}</span>
        `;
        elTambahBtn.style.display = "block";
        elStatus.innerText = "✅ Nomor resi berhasil terdeteksi.";
        elStatus.style.color = "#16a34a";
      } else {
        elHasilText.innerHTML = `
          <span style="color:#dc2626; font-weight:600;">Nomor resi tidak terdeteksi otomatis.</span>
          <span class="raw-text">${teksMentah.replace(/\n/g, "<br>")}</span>
        `;
        elStatus.innerText = "⚠️ Teks terbaca, tapi format resi tidak cocok.";
        elStatus.style.color = "#ea580c";
      }

    } catch(error) {
      elStatus.innerText = "❌ Gagal membaca gambar: " + error.message;
      elStatus.style.color = "#dc2626";
    }
  }

  function cariNomorResi(teks) {
    if (!teks) return null;
    let t = teks.toUpperCase().replace(/\|/g, "I").replace(/\n+/g, " ").replace(/\s+/g, " ").trim();

    let match = t.match(/S\s*P\s*X\s*I\s*D\s*[-: ]*\s*(\d{10,20})/i);
    if (match) return "SPXID" + match[1];

    match = t.match(/SPX\s*ID\s*[-: ]*\s*(\d{10,20})/i);
    if (match) return "SPXID" + match[1];

    match = t.match(/SPXID[^0-9]{0,10}(\d{10,20})/i);
    if (match) return "SPXID" + match[1];

    return null;
  }

  function hapusResi(index) {
    if (confirm("Hapus resi " + resi[index] + "?")) {
      resi.splice(index, 1);
      simpan();
      tampilkan();
    }
  }

  function hapusSemua() {
    if (resi.length === 0) return;
    if (!confirm("⚠️ Yakin ingin menghapus SEMUA resi?")) return;
    resi = [];
    simpan();
    tampilkan();
    elStatus.innerText = "Daftar resi telah dibersihkan.";
    elStatus.style.color = "#64748b";
  }

  // FUNGSI KIRIM GOOGLE SHEETS
  function kirimSemua() {
    const namaPetugas = elPetugas.value.trim();

    if (!namaPetugas) {
      alert("⚠️ Harap masukkan Nama Petugas terlebih dahulu.");
      elPetugas.focus();
      return;
    }

    if (resi.length === 0) {
      alert("⚠️ Belum ada resi untuk dikirim.");
      return;
    }

    if (!confirm("🚀 Kirim " + resi.length + " resi sekarang?")) return;

    const batchId = namaPetugas.toUpperCase().substring(0,3) + "-" + Date.now();
    
    const params = new URLSearchParams({
      petugas: namaPetugas,
      batch: batchId,
      resi: resi.join(","),
      callback: "handleResponse"
    });

    elStatus.innerText = "⏳ Sedang mengirim data ke Google Sheets...";
    elStatus.style.color = "#2563eb";

    window.handleResponse = function(response) {
      if (response.status === "success") {
        alert("✅ Data berhasil dikirim ke Google Sheets!");
        resi = [];
        simpan();
        tampilkan();
        elStatus.innerText = "✅ Data berhasil disimpan.";
        elStatus.style.color = "#16a34a";
      } else {
        alert("❌ Gagal menyimpan: " + response.message);
        elStatus.innerText = "❌ Terjadi kesalahan.";
        elStatus.style.color = "#dc2626";
      }
      
      const scriptEl = document.getElementById("jsonp-script");
      if (scriptEl) scriptEl.remove();
    };

    const script = document.createElement("script");
    script.id = "jsonp-script";
    script.src = APPS_SCRIPT_URL + "?" + params.toString();
    script.onerror = function() {
      alert("❌ Gagal terhubung ke Google Sheets. Cek koneksi internet atau URL Apps Script.");
      elStatus.innerText = "❌ Pengiriman gagal.";
      elStatus.style.color = "#dc2626";
    };
    
    document.body.appendChild(script);
  }

  // Load Awal
  tampilkan();
</script>

</body>
</html>
