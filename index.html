<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Scanner Resi OCR</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.header {
  background: #16a34a;
  color: white;
  padding: 18px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.green {
  background: #16a34a;
  color: white;
}

.blue {
  background: #2563eb;
  color: white;
}

.red {
  background: #dc2626;
  color: white;
}

.gray {
  background: #e5e7eb;
  color: #111827;
}

video {
  width: 100%;
  border-radius: 12px;
  background: black;
  margin-top: 12px;
}

#foto {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
  display: none;
}

.hasil {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
  word-break: break-all;
}

.total {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  color: #16a34a;
}

.resi {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 4px;
  border-bottom: 1px solid #e5e7eb;
  gap: 8px;
}

.resi span {
  word-break: break-all;
}

.resi button {
  width: auto;
  margin: 0;
  padding: 7px 10px;
  font-size: 12px;
}

.status {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  background: #f3f4f6;
}

.small {
  color: #6b7280;
  font-size: 13px;
  margin-top: 8px;
}
</style>.tombol {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
</head>

<body>

<div class="header">
  📦 Scanner Resi OCR
</div>

<div class="container">

  <div class="card">

    <b>Nama Petugas</b>

    <input
      id="petugas"
      placeholder="Contoh: Dhian"
      autocomplete="off"
    >

  </div>

  <div class="card">

    <div class="total">
      <span id="jumlah">0</span> RESI
    </div>

    <label for="kameraInput" class="green tombol">
  📷 FOTO NOMOR RESI
</label>

<input
  id="kameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  style="display:none"
  onchange="prosesFile(event)"
>

<label for="galeriInput" class="gray tombol">
  🖼️ PILIH FOTO DARI GALERI
</label>

<input
  id="galeriInput"
  type="file"
  accept="image/*"
  style="display:none"
  onchange="prosesFile(event)"
>
