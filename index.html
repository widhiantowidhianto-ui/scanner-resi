<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Scanner Resi OCR</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.header {
  background: #16a34a;
  color: white;
  padding: 18px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.green {
  background: #16a34a;
  color: white;
}

.blue {
  background: #2563eb;
  color: white;
}

.red {
  background: #dc2626;
  color: white;
}

.gray {
  background: #e5e7eb;
  color: #111827;
}

video {
  width: 100%;
  border-radius: 12px;
  background: black;
  margin-top: 12px;
}

#foto {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
  display: none;
}

.hasil {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
  word-break: break-all;
}

.total {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  color: #16a34a;
}

.resi {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 4px;
  border-bottom: 1px solid #e5e7eb;
  gap: 8px;
}

.resi span {
  word-break: break-all;
}

.resi button {
  width: auto;
  margin: 0;
  padding: 7px 10px;
  font-size: 12px;
}

.status {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  background: #f3f4f6;
}

.small {
  color: #6b7280;
  font-size: 13px;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="header">
  📦 Scanner Resi OCR
</div>

<div class="container">

  <div class="card">

    <b>Nama Petugas</b>

    <input
      id="petugas"
      placeholder="Contoh: Dhian"
      autocomplete="off"
    >

  </div>

  <div class="card">

    <div class="total">
      <span id="jumlah">0</span> RESI
    </div>

    <button
  type="button"
  class="green"
  onclick="document.getElementById('kameraInput').click()">
  📷 FOTO NOMOR RESI
</button>

<input
  id="kameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  style="display:none"
  onchange="prosesFile(event)"
>

<button
  type="button"
  class="gray"
  onclick="document.getElementById('galeriInput').click()">
  🖼️ PILIH FOTO DARI GALERI
</button>

<input
  id="galeriInput"
  type="file"
  accept="image/*"
  style="display:none"
  onchange="prosesFile(event)"
>
>
>
    >

    <canvas
      id="canvas"
      style="display:none">
    </canvas>

    <img
      id="foto">

    <div
      id="status"
      class="status">
      Siap. Foto nomor resi untuk mulai membaca.
    </div>

    <div
      id="hasil"
      class="hasil"
      style="display:none">

      <b>Hasil pembacaan:</b>

      <div
        id="hasilText"
        style="margin-top:8px">
      </div>

    </div>

    <button
      id="tambahBtn"
      class="green"
      style="display:none"
      onclick="gunakanHasil()">

      ✅ TAMBAHKAN NOMOR INI

    </button>

  </div>

  <div class="card">

    <b>Daftar Resi</b>

    <div id="daftar"></div>

  </div>

  <div class="card">

    <button
      class="green"
      onclick="kirimSemua()">

      🚀 KIRIM SEMUA RESI

    </button>

    <button
      class="red"
      onclick="hapusSemua()">

      🗑️ HAPUS SEMUA

    </button>

  </div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/a/macros/spxexpress.com/s/AKfycbz5eS8WeGfnkHWeLD6AKBjdW78LIWgdH-Tzv_pvzWz9u0MexAOMEIFtfoD9A3RrI42WXw/exec";

let stream = null;
let hasilNomor = "";

let resi = JSON.parse(
  localStorage.getItem("scanner_resi") || "[]"
);

const petugas =
  document.getElementById("petugas");

petugas.value =
  localStorage.getItem("scanner_petugas") || "";

petugas.addEventListener("input", function() {

  localStorage.setItem(
    "scanner_petugas",
    petugas.value
  );

});

function tampilkan() {

  document.getElementById("jumlah").innerText =
    resi.length;

  const daftar =
    document.getElementById("daftar");

  daftar.innerHTML = "";

  resi.forEach(function(nomor, index) {

    const div =
      document.createElement("div");

    div.className = "resi";

    div.innerHTML =
      "<span>" +
      (index + 1) +
      ". <b>" +
      nomor +
      "</b></span>" +

      "<button class='red' " +
      "onclick='hapusResi(" +
      index +
      ")'>HAPUS</button>";

    daftar.appendChild(div);

  });

}

function simpan() {

  localStorage.setItem(
    "scanner_resi",
    JSON.stringify(resi)
  );

}

async function bukaKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });

    const video =
      document.getElementById("video");

    video.srcObject = stream;

    document.getElementById("status").innerText =
      "🟢 Kamera aktif. Arahkan ke nomor resi.";

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ Kamera gagal: " +
      error.name +
      " - " +
      error.message;

  }

}

function ambilFoto() {

  const video =
    document.getElementById("video");

  if (!stream) {

    alert(
      "Buka kamera terlebih dahulu."
    );

    return;

  }

  const canvas =
    document.getElementById("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(
    function(blob) {

      prosesGambar(blob);

    },
    "image/jpeg",
    0.95
  );

}

function pilihFoto() {

  document
    .getElementById("fileFoto")
    .click();

}

function prosesFile(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  prosesGambar(file);

}

async function prosesGambar(file) {

  const status =
    document.getElementById("status");

  const foto =
    document.getElementById("foto");

  const hasil =
    document.getElementById("hasil");

  const hasilText =
    document.getElementById("hasilText");

  const tambahBtn =
    document.getElementById("tambahBtn");

  hasil.style.display = "none";

  tambahBtn.style.display = "none";

  hasilNomor = "";

  foto.src =
    URL.createObjectURL(file);

  foto.style.display = "block";

  status.innerText =
    "🔍 Sedang membaca tulisan pada foto...";

  try {

    const result =
      await Tesseract.recognize(
        file,
        "eng",
        {
          logger: function(info) {

            if (
              info.status ===
              "recognizing text"
            ) {

              const persen =
                Math.round(
                  info.progress * 100
                );

              status.innerText =
                "🔍 Membaca... " +
                persen +
                "%";

            }

          }
        }
      );

    const teks =
      result.data.text;

    console.log(teks);

    hasilText.innerText =
      teks || "Tidak ada tulisan terbaca.";

    hasil.style.display =
      "block";

    const kandidat =
      cariNomorResi(teks);

    if (kandidat) {

      hasilNomor = kandidat;

      hasilText.innerHTML =
        "<b>" +
        kandidat +
        "</b>" +
        "<br><br>" +
        "<small>" +
        teks.replace(/\n/g, "<br>") +
        "</small>";

      tambahBtn.style.display =
        "block";

      status.innerText =
        "✅ Nomor resi terdeteksi.";

    } else {

      status.innerText =
        "⚠️ Tulisan terbaca, tetapi nomor resi belum terdeteksi. Periksa hasil OCR.";

    }

  } catch(error) {

    status.innerText =
      "❌ OCR gagal: " +
      error.message;

  }

}

function cariNomorResi(teks) {

  if (!teks) return null;

  let t = teks.toUpperCase();

  // Bersihkan karakter yang sering salah dibaca OCR
  t = t
    .replace(/\|/g, "I")
    .replace(/\n+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  /*
   * PRIORITAS UTAMA:
   * Cari nomor resi SPXID + angka.
   *
   * Contoh:
   * SPXID068255909326
   * SPXID 068255909326
   * SPXID-068255909326
   */

  let match = t.match(
    /S\s*P\s*X\s*I\s*D\s*[-: ]*\s*(\d{10,20})/i
  );

  if (match) {

    return "SPXID" + match[1];

  }

  /*
   * Jika OCR memisahkan SPX ID,
   * contoh:
   * SPX ID 068255909326
   */

  match = t.match(
    /SPX\s*ID\s*[-: ]*\s*(\d{10,20})/i
  );

  if (match) {

    return "SPXID" + match[1];

  }

  /*
   * Jika OCR salah membaca angka menjadi
   * beberapa bagian, coba cari:
   * SPXID + angka
   */

  match = t.match(
    /SPXID[^0-9]{0,10}(\d{10,20})/i
  );

  if (match) {

    return "SPXID" + match[1];

  }

  /*
   * JANGAN mengambil kata seperti:
   * DISERTAKAN, CUSTOMER, EXPRESS, dll.
   *
   * Jika SPXID tidak ditemukan,
   * kita tidak mengambil kandidat acak.
   */

  return null;
}

function gunakanHasil() {

  if (!hasilNomor) return;

  tambahResi(hasilNomor);

}

function tambahResi(nomor) {

  nomor =
    String(nomor)
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");

  if (!nomor) return;

  if (resi.includes(nomor)) {

    document.getElementById("status").innerText =
      "⚠️ Resi sudah ada.";

    return;

  }

  resi.push(nomor);

  simpan();

  tampilkan();

  document.getElementById("status").innerText =
    "✅ Resi ditambahkan: " +
    nomor;

}

function hapusResi(index) {

  resi.splice(index, 1);

  simpan();

  tampilkan();

}

function hapusSemua() {

  if (!confirm(
    "Yakin hapus semua resi?"
  )) return;

  resi = [];

  simpan();

  tampilkan();

}

async function kirimSemua() {

  const nama =
    petugas.value.trim();

  if (!nama) {

    alert(
      "Masukkan nama petugas."
    );

    return;

  }

  if (resi.length === 0) {

    alert(
      "Belum ada resi."
    );

    return;

  }

  const batch =
    nama.toUpperCase() +
    "-" +
    Date.now();

  const data = {

    petugas: nama,

    batch: batch,

    resi: resi

  };

  document.getElementById("status").innerText =
    "⏳ Mengirim " +
    resi.length +
    " resi...";

  try {

    await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(data)
      }
    );

    alert(
      "✅ Batch berhasil dikirim."
    );

    resi = [];

    simpan();

    tampilkan();

    document.getElementById("status").innerText =
      "✅ Data sudah dikirim ke pusat.";

  } catch(error) {

    alert(
      "❌ Pengiriman gagal."
    );

    document.getElementById("status").innerText =
      "❌ Gagal mengirim.";

  }

}

tampilkan();

</script>

</body>
</html>
